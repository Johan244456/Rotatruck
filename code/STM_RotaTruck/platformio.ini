; PlatformIO Project Configuration File
;
;   STM RotaTruck — port to STM32F407G-DISC1 (STM32F407VGT6, 168 MHz, 1 MB flash)
;   Original G491RE project: ../Rotatruck
;   Program/power via the mini-USB "USB ST-LINK" connector (CN1).

[platformio]
;   imu_test      = IMU + handle switch + ODrive CAN heartbeats (listen only)
;   loadcell_test = HX711 load detection with its LD console
; disco_f407vg = the full RotaTruck firmware (motors via CAN, assist, load
; detection); console = RTT in the PlatformIO serial monitor.
default_envs = imu_test

[env:disco_f407vg]
platform     = ststm32
board        = disco_f407vg
framework    = stm32cube

build_flags =
    -Iinclude
    -DUSE_HAL_DRIVER
    -DSTM32F407xx
    -DHSE_VALUE=8000000U
    -Wall
    -Wextra
    ; HAL callbacks take unused handle params - suppress just this one, keep the rest of -Wextra.
    -Wno-unused-parameter
    ; force-link newlib float printf/scanf - needed for %f in UART telemetry; do not remove.
    -Wl,-u,_printf_float
    -Wl,-u,_scanf_float

build_unflags =
    ; (intentionally empty)

; the bring-up envs have their own main() and console I/O
build_src_filter = +<*> -<imu_test_main.c> -<loadcell_test_main.c> -<bringup_io.c>

monitor_speed = 115200
; console over the ST-Link (RTT) - the DISC1 VCP is not wired to the F407
monitor_port    = socket://localhost:9090
monitor_filters = rtt
monitor_echo    = yes
upload_protocol = stlink
debug_tool      = stlink

; Standalone IMU bring-up: ISM330DHCX on I2C1 (PB8/PB9) streamed at 10 Hz on
; RTT over the ST-Link (pio device monitor / tools/rtt_monitor.sh) and on
; USART2 TX = PA2 (115200).
;   pio run -e imu_test -t upload   then   pio device monitor
[env:imu_test]
extends          = env:disco_f407vg
build_src_filter = -<*> +<imu_test_main.c> +<clock_f4.c> +<stm32f4xx_hal_msp.c> +<bringup_io.c> +<rtt.c>
                   +<imu.c> +<ism330.c> +<deadman.c> +<odrive_can.c>
build_flags      = ${env:disco_f407vg.build_flags} -DIMU_ENABLE=1
; Serial monitor over the ST-Link: the `rtt` filter (monitor/filter_rtt.py)
; starts OpenOCD's RTT server and the monitor connects to it.  The DISC1's
; /dev/ttyACM0 VCP is not wired to the F407, so it never shows anything.
; For a USB-serial adapter on PA2 instead, set monitor_port to its /dev/ttyUSBx
; and remove monitor_filters.
monitor_port    = socket://localhost:9090
monitor_filters = rtt

; Standalone load-detection bring-up (LOAD_DETECTION.md "Bring-up" steps):
; 2 x HX711 (CH1 PA10/PB3, CH2 PB5/PB4) + IMU pose gating, with the LD
; console on from boot.  No CAN / motors.  Type commands + Enter in the
; serial monitor (echoed locally).
;   pio run -e loadcell_test -t upload   then   pio device monitor -e loadcell_test
[env:loadcell_test]
extends          = env:disco_f407vg
build_src_filter = -<*> +<loadcell_test_main.c> +<clock_f4.c> +<stm32f4xx_hal_msp.c> +<bringup_io.c> +<rtt.c>
                   +<imu.c> +<ism330.c> +<loadcell.c>
; Pose simulator (q f s / r / t / 0) for calibration tests without an IMU.
; Bench env ONLY - never add this to the motor firmware.
; LCTEST_IMU=0: IMU disabled (never started/read even if wired) - bench load
; tests as with no IMU. Set to 1 to use the ISM330DHCX for pose gating.
build_flags      = ${env:disco_f407vg.build_flags} -DLC_POSE_SIM=1 -DLCTEST_IMU=0
monitor_port    = socket://localhost:9090
monitor_filters = rtt
monitor_echo    = yes
