; PlatformIO Project Configuration File
;
;   STM RotaTruck — ODrive_S1 branch (CAN-bus motor control)
;   See ../../docs/02_branch/ODRIVE_INTEGRATION.md for design notes.

[env:nucleo_g491re]
platform     = ststm32
board        = nucleo_g491re
framework    = stm32cube

build_flags =
    -Iinclude
    -DUSE_HAL_DRIVER
    -DSTM32G491xx
    -Wall
    -Wextra
    ; HAL callbacks take unused handle params - suppress just this one, keep the rest of -Wextra.
    -Wno-unused-parameter
    ; force-link newlib float printf/scanf - needed for %f in UART telemetry; do not remove.
    -Wl,-u,_printf_float
    -Wl,-u,_scanf_float

build_unflags =
    ; (intentionally empty)

monitor_speed = 115200
upload_protocol = stlink
debug_tool      = stlink
